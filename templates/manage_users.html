<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Manage Users - C&W Story Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='mobile.css') }}" media="(max-width:760px)">
    <style>
        .admin-container {
            max-width: 900px;
            margin: 20px auto;
            padding: 20px;
        }
        .admin-section {
            margin-bottom: 30px;
        }
        .admin-section h2 {
            margin-top: 0;
            border-bottom: 2px solid #ddd;
            padding-bottom: 10px;
        }
        .form-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .form-group input {
            flex: 1;
            min-width: 200px;
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .form-group button {
            padding: 8px 16px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .form-group button:hover {
            background: #2563eb;
        }
        .users-list {
            border: 1px solid #ddd;
            border-radius: 4px;
            overflow: hidden;
        }
        .user-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid #eee;
        }
        .user-item:last-child {
            border-bottom: none;
        }
        .user-info {
            flex: 1;
        }
        .user-name {
            font-weight: bold;
            margin-bottom: 4px;
        }
        .user-email {
            color: #666;
            font-size: 14px;
        }
        .user-actions {
            display: flex;
            gap: 10px;
        }
        .user-actions button {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .toggle-btn {
            background: #28a745;
            color: white;
        }
        .toggle-btn.inactive {
            background: #ffc107;
        }
        .delete-btn {
            background: #dc3545;
            color: white;
        }
        .empty-state {
            padding: 20px;
            text-align: center;
            color: #999;
        }
        .error-message {
            color: #dc3545;
            padding: 10px;
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            border-radius: 4px;
            margin-bottom: 15px;
        }
        .success-message {
            color: #155724;
            padding: 10px;
            background: #d4edda;
            border: 1px solid #c3e6cb;
            border-radius: 4px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<a href="{{ url_for('manage') }}" class="back-button">← Back to Admin Settings</a>

<div class="user-box">
  <span class="greeting">Hello, {{ current_user.name }}!</span>
  <form action="{{ url_for('logout') }}" method="get">
    <button type="submit">Logout</button>
  </form>
</div>

<div style="display: flex; justify-content: center; align-items: center;">
  <h1 style="display: inline;"><a href="https://www.ccpstudentnews.org" style="font-family: 'Brush Script MT'; text-decoration: none; color: #222; font-size: 45px;">Cardinal and White&nbsp; </a></h1><h1 style="display: inline;">User Directory</h1>
</div>

<div class="admin-container">

    <div id="messageContainer"></div>

    <div class="admin-section">
        <h2>Add New User</h2>
        <div class="form-group">
            <input type="text" id="newUserName" placeholder="Full Name" required>
            <input type="email" id="newUserEmail" placeholder="Email Address" required>
            <button onclick="addUser()">Add User</button>
        </div>
    </div>

    <div class="admin-section">
        <h2>Users List</h2>
        <div id="usersList" class="users-list">
            <div class="empty-state">Loading users...</div>
        </div>
    </div>
</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js" crossorigin="anonymous"></script>
<script>
const socket = io();

function loadUsers() {
    fetch('/api/users/list')
        .then(r => r.json())
        .then(data => {
            const container = document.getElementById('usersList');
            if (!data.users || data.users.length === 0) {
                container.innerHTML = '<div class="empty-state">No users yet. Add one to get started!</div>';
                return;
            }
            container.innerHTML = data.users.map(user => `
                <div class="user-item">
                    <div class="user-info">
                        <div class="user-name">${escapeHtml(user.name)}</div>
                        <div class="user-email">${escapeHtml(user.email)}</div>
                    </div>
                    <div class="user-actions">
                        <button class="toggle-btn ${!user.active ? 'inactive' : ''}"
                                onclick="toggleUser(${user.id})">
                            ${user.active ? 'Active' : 'Inactive'}
                        </button>
                        <button class="delete-btn" onclick="deleteUser(${user.id})">Delete</button>
                    </div>
                </div>
            `).join('');
        })
        .catch(err => showError('Failed to load users: ' + err.message));
}

function addUser() {
    const name = document.getElementById('newUserName').value.trim();
    const email = document.getElementById('newUserEmail').value.trim();

    if (!name || !email) {
        showError('Please enter both name and email');
        return;
    }

    fetch('/api/users/add', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email })
    })
    .then(r => r.json())
    .then(data => {
        if (data.error) {
            showError(data.error);
        } else {
            showSuccess('User added successfully!');
            document.getElementById('newUserName').value = '';
            document.getElementById('newUserEmail').value = '';
            loadUsers();
        }
    })
    .catch(err => showError('Failed to add user: ' + err.message));
}

function deleteUser(userId) {
    if (!confirm('Are you sure you want to delete this user?')) return;

    fetch('/api/users/delete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user_id: userId })
    })
    .then(r => r.json())
    .then(data => {
        if (data.error) {
            showError(data.error);
        } else {
            showSuccess('User deleted successfully!');
            loadUsers();
        }
    })
    .catch(err => showError('Failed to delete user: ' + err.message));
}

function toggleUser(userId) {
    fetch('/api/users/toggle', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user_id: userId })
    })
    .then(r => r.json())
    .then(data => {
        if (data.error) {
            showError(data.error);
        } else {
            loadUsers();
        }
    })
    .catch(err => showError('Failed to toggle user: ' + err.message));
}

function showError(msg) {
    const container = document.getElementById('messageContainer');
    container.innerHTML = `<div class="error-message">${escapeHtml(msg)}</div>`;
    setTimeout(() => container.innerHTML = '', 5000);
}

function showSuccess(msg) {
    const container = document.getElementById('messageContainer');
    container.innerHTML = `<div class="success-message">${escapeHtml(msg)}</div>`;
    setTimeout(() => container.innerHTML = '', 5000);
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

socket.on('user_added', () => loadUsers());
socket.on('user_deleted', () => loadUsers());
socket.on('user_toggled', () => loadUsers());

loadUsers();
</script>
</body>
</html>
