<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>C&W Story Admin</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='ccp.ico') }}">
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
</head>
<body>

<a href="{{ url_for('manage') }}" class="back-button">← Back to Admin Settings</a>

<div class="user-box">
  <span class="greeting">Hello, {{ current_user.name }}!</span>
    
  <form action="{{ url_for('logout') }}" method="get">
    <button type="submit">Logout</button>
  </form>
</div>

 <div style="display: flex; justify-content: center; align-items: center;">
    <h1 style="display: inline;"><a href="https://www.ccpstudentnews.org" style="font-family: 'Brush Script MT'; text-decoration: none; color: #222; font-size: 45px;">Cardinal and White&nbsp; </a></h1><h1 style="display: inline;">Permissions</h1>
    </div>

<main style="max-width:800px;margin:20px auto;padding:10px;">
  <section>
    <p>Manage which users are allowed to access admin sections. Select a name from the user directory.</p>

    <div id="messages" style="color: red; margin-bottom: 8px;"></div>

    <div style="display:flex; gap:8px; margin-bottom:12px; position: relative;">
      <div style="position: relative; flex: 1;">
        <input id="new-name" type="text" placeholder="Search by name..." style="width:100%;padding:6px;" autocomplete="off" />
        <ul id="name-suggestions" style="list-style:none;padding:0;margin:0;position:absolute;top:100%;left:0;right:0;background:white;border:1px solid #ddd;border-top:none;border-radius:0 0 4px 4px;max-height:200px;overflow-y:auto;z-index:100;display:none;"></ul>
      </div>
      <button id="add-btn">Add</button>
    </div>

    <ul id="allowed-list" style="list-style:none;padding:0;margin:0;">

    </ul>
  </section>
</main>

<script>
const nameInput = document.getElementById('new-name');
const suggestionsList = document.getElementById('name-suggestions');
let selectedUser = null;

async function showMessage(msg, isError=true){
  const el = document.getElementById('messages');
  el.textContent = msg;
  el.style.color = isError ? 'red' : 'green';
  if(msg){ setTimeout(()=>el.textContent='', 4000); }
}

async function fetchList(){
  const res = await fetch('/api/permissions/list');
  if(res.status !== 200){ showMessage('Failed to load list'); return; }
  const data = await res.json();
  const ul = document.getElementById('allowed-list');
  ul.innerHTML = '';

  (data.allowed || []).sort((a,b)=>a.email.localeCompare(b.email)).forEach(item=>{
    const li = document.createElement('li');
    li.style.display='flex'; li.style.justifyContent='space-between'; li.style.padding='6px 0';
    const span = document.createElement('span'); span.textContent = item.email;
    const right = document.createElement('div');
    if(item.protected){
      const prot = document.createElement('span'); prot.textContent='(owner)'; prot.style.marginRight='12px'; prot.style.color='#666';
      right.appendChild(prot);
      const del = document.createElement('button'); del.textContent='Remove'; del.style.marginLeft='12px'; del.disabled = true; del.title = 'This email is permanently protected';
      right.appendChild(del);
    } else {
      const del = document.createElement('button'); del.textContent='Remove'; del.style.marginLeft='12px';
      del.addEventListener('click', ()=>removeEmail(item.email));
      right.appendChild(del);
    }
    li.appendChild(span); li.appendChild(right);
    ul.appendChild(li);
  });
}

async function addEmail(email){
  const res = await fetch('/api/permissions/add', {method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({email})});
  const data = await res.json();
  if(res.ok){ showMessage('Added: '+email, false); fetchList(); }
  else showMessage((data && data.error) ? data.error : 'Add failed');
}

async function removeEmail(email){
  if(!confirm('Remove '+email+' from allowed list?')) return;
  const res = await fetch('/api/permissions/delete', {method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({email})});
  const data = await res.json();
  if(res.ok){ showMessage('Removed: '+email, false); fetchList(); }
  else showMessage((data && data.error) ? data.error : 'Remove failed');
}

// Autocomplete for names
nameInput.addEventListener('input', async ()=>{
  const query = nameInput.value.trim();
  if(query.length < 1){
    suggestionsList.innerHTML = '';
    suggestionsList.style.display = 'none';
    return;
  }
  try{
    const res = await fetch(`/api/users/search?q=${encodeURIComponent(query)}&limit=10`);
    const users = await res.json();
    if(users.length === 0){
      suggestionsList.innerHTML = '';
      suggestionsList.style.display = 'none';
      return;
    }
    suggestionsList.innerHTML = users.map((user, idx) => `
      <li style="padding:8px;cursor:pointer;border-bottom:1px solid #eee;" data-name="${user.name}" data-email="${user.email}" onclick="selectUserForPermission(this)">
        <strong>${user.name}</strong><br/><span style="font-size:0.85em;color:#666;">${user.email}</span>
      </li>
    `).join('');
    suggestionsList.style.display = 'block';
  }catch(err){
    showMessage('Error searching users');
  }
});

nameInput.addEventListener('keydown', (e)=>{
  if(e.key === 'Escape'){
    suggestionsList.innerHTML = '';
    suggestionsList.style.display = 'none';
  }
});

function selectUserForPermission(element){
  const name = element.getAttribute('data-name');
  const email = element.getAttribute('data-email');
  nameInput.value = name;
  selectedUser = { name, email };
  suggestionsList.innerHTML = '';
  suggestionsList.style.display = 'none';
}

document.addEventListener('click', (e)=>{
  if(e.target !== nameInput && !suggestionsList.contains(e.target)){
    suggestionsList.innerHTML = '';
    suggestionsList.style.display = 'none';
  }
});

document.getElementById('add-btn').addEventListener('click', ()=>{
  if(!selectedUser){
    return showMessage('Please select a user from the directory');
  }
  addEmail(selectedUser.email);
  nameInput.value = '';
  selectedUser = null;
});

fetchList().catch(()=>showMessage('Unable to load permissions'));
</script>

</body>
</html>
